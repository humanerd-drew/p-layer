[project]
name = "p-layers"
version = "0.1.3"
description = "7 governance layers for AI agent memory — P0-P6 with KnowledgeDB, MCP server, and wiki-compile"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2.0",
]
[project.optional-dependencies]
pg = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "numpy>=1.24",
]
test = [
    "pytest>=7.0",
]

[project.urls]
Home = "https://github.com/humanerd-drew/p-layer"

[project.scripts]
p-layer-mcp = "p_layer.mcp.server:main"
p-layer-init = "p_layer.__main__:main"
p-layer = "p_layer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["p_layer*"]
