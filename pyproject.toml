[project]
name = "p-layer"
version = "0.1.0"
description = "Knowledge governance layers for AI agents — P0-P6 memory system"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]
optional-dependencies = {
    "pg" = [
        "psycopg2-binary>=2.9",
        "pgvector>=0.3",
        "numpy>=1.24",
    ],
    "all" = [
        "psycopg2-binary>=2.9",
        "pgvector>=0.3",
        "numpy>=1.24",
    ],
}

[project.urls]
Home = "https://github.com/humanerd-drew/p-layer"

[project.scripts]
p-layer-mcp = "knowledge_system.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowledge_system*"]
