[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memcore"
version = "0.6.0"
description = "Production-grade agent memory layer — SQLite + FTS5 + pluggable embeddings, stdlib-only"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
memcore = "memcore.cli:main"

[tool.setuptools]
packages = ["memcore"]
