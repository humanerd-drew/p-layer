[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p-layers"
version = "0.8.1"
description = "Memory for AI agents with rules that are kept, not just written. P0-P6 layered rules enforced in code. SQLite + FTS5 + pluggable embeddings, PostgreSQL backend, MCP server, eval harness. (GitHub: p-layer)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
readme = "README.md"

[project.urls]
Homepage = "https://humanerd.kr"
Repository = "https://github.com/humanerd-drew/p-layer"
Documentation = "https://humanerd.kr"

[project.scripts]
p-layer = "p_layer.cli:main"

[tool.setuptools]
packages = ["p_layer", "p_layer.compat"]
