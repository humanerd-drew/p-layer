name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - python-version: "3.14"
            allow-prereleases: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases || false }}
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p_layer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PG deps + MCP SDK (client conformance)
        run: pip install psycopg2-binary pgvector "mcp<2"
      - name: Run full suite (SQLite + PG backend + MCP SDK client)
        run: python -m unittest discover -s tests -v
        env:
          P_LAYER_TEST_PG_DSN: "dbname=p_layer_test host=localhost port=5432 user=postgres password=postgres"
